name: Publish free public website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check the root-site repository
        run: |
          python - <<'PY'
          import os
          owner=os.environ['GITHUB_REPOSITORY_OWNER'].lower()
          required=owner+'/'+owner+'.github.io'
          if os.environ['GITHUB_REPOSITORY'].lower()!=required:
              raise SystemExit('Use the root Pages repository '+required+' for this beginner preset.')
          PY
      - name: Install export dependencies
        run: |
          grep -vE '^(playwright|pytest|pytest-asyncio)' requirements.lock > /tmp/runtime-requirements.txt
          pip install -r /tmp/runtime-requirements.txt
      - name: Export public website
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          GOOGLE_TOKEN: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_TOKEN: ${{ vars.BING_SITE_VERIFICATION }}
        run: |
          python scripts/export_pages.py \
            --site-origin "https://${GITHUB_REPOSITORY_OWNER,,}.github.io" \
            --backend-origin "$BACKEND_URL" \
            --google-token "$GOOGLE_TOKEN" \
            --bing-token "$BING_TOKEN" \
            --output .pages-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
